name: Sync Orders (Every 2 Hours)

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  sync-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orders Sync Endpoint
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "https://cyncer.vercel.app/api/cron/sync-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response: $BODY"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Orders sync failed with HTTP status $STATUS"
            exit 1
          fi
