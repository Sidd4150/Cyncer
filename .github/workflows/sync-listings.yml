name: Sync Listings (Daily at Midnight PST)

on:
  schedule:
    # Runs daily at 12:00 AM PST (7:00 AM UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  sync-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Listings Sync Endpoint
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "https://cyncer.vercel.app/api/cron/sync-listings" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response: $BODY"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Listings sync failed with HTTP status $STATUS"
            exit 1
          fi
